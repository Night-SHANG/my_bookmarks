<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网址导航</title>
    <meta name="description" content="个人网址导航 — 快速访问常用网站">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#searchInput">跳到搜索</a>
<div class="app">
 <aside class="sidebar" aria-label="导航与管理">
  <div class="brand"><i class="fas fa-bookmark" aria-hidden="true"></i><div><h1>我的导航</h1><p>个人收藏夹</p></div></div>
  <nav class="category-bar" id="categoryBar" aria-label="书签分类"></nav>
  <div class="sidebar-footer">
   <button class="sidebar-action" id="dataPanelBtn" aria-expanded="false"><i class="fas fa-arrow-up-from-bracket" aria-hidden="true"></i>导入 / 导出</button>
   <div class="utility-panel" id="dataPanel" hidden><button class="btn btn-ghost" id="importBtn">导入 JSON</button><button class="btn btn-ghost" id="exportBtn">导出 JSON</button><button class="btn btn-ghost" id="restoreBtn">恢复上次备份</button><p>导入会替换收藏，并保留一份本地备份。</p></div>
   <button class="sidebar-action" id="appearanceBtn" aria-expanded="false"><i class="fas fa-gear" aria-hidden="true"></i>外观设置</button>
   <div class="utility-panel appearance-panel" id="appearancePanel" hidden>
                <div class="color-picker-wrapper">
                    <button class="btn btn-icon" id="colorPickerBtn" title="自定义主题色">
                        <i class="fas fa-palette"></i>
                    </button>
                    <div class="color-picker-panel" id="colorPanel">
                        <div class="color-presets"><button class="color-dot" data-color="#367454" style="background:#367454" title="森林绿"></button>
                            <button class="color-dot" data-color="#c9553d" style="background:#c9553d" title="赤陶橙"></button>
                            <button class="color-dot" data-color="#4f46e5" style="background:#4f46e5" title="靛蓝"></button>
                            <button class="color-dot" data-color="#059669" style="background:#059669" title="翡翠绿"></button>
                            <button class="color-dot" data-color="#d97706" style="background:#d97706" title="琥珀黄"></button>
                            <button class="color-dot" data-color="#e11d48" style="background:#e11d48" title="玫瑰红"></button>
                            <button class="color-dot" data-color="#7c3aed" style="background:#7c3aed" title="紫罗兰"></button>
                            <button class="color-dot" data-color="#0284c7" style="background:#0284c7" title="天蓝"></button>
                            <button class="color-dot" data-color="#475569" style="background:#475569" title="石板灰"></button>
                        </div>
                        <div class="color-custom">
                            <input type="color" id="customColor" value="#367454" title="选择自定义颜色">
                            <span>自定义颜色</span>
                        </div>
                    </div>
                </div>
                <button class="btn btn-icon" id="themeToggle" title="切换深色模式">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
</div>
  </div>
 </aside>
 <div class="workspace">
  <header class="header">
   <div class="header-intro"><h2>收藏，让灵感随手可达。</h2><p>常用网站，有序收藏。</p></div>
   <div class="header-actions">
    <div class="columns-toolbar"><span class="columns-label" id="columnsLabel">列数</span><div class="grid-control" role="group" aria-labelledby="columnsLabel">
     <button class="btn btn-icon" id="colsDecrease" title="减少列数" aria-label="减少列数" type="button"><i class="fas fa-minus" aria-hidden="true"></i></button>
     <span class="cols-display" id="colsDisplay" aria-live="polite">4列</span>
     <button class="btn btn-icon" id="colsIncrease" title="增加列数" aria-label="增加列数" type="button"><i class="fas fa-plus" aria-hidden="true"></i></button>
    </div></div>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus" aria-hidden="true"></i><span>添加站点</span></button>
   </div>
  </header>
  <div id="storageWarning" class="storage-warning" role="alert" hidden></div>
  <section class="search-section" aria-label="查找网站">
   <div class="search-wrapper"><i class="fas fa-search search-icon" aria-hidden="true"></i><input type="search" id="searchInput" class="search-input" placeholder="搜索书签、描述或网址…" aria-label="搜索书签、描述或网址" autocomplete="off"><kbd class="search-kbd">/</kbd></div>
   <div class="engine-row"><span>联网搜索：</span><div class="engine-tabs" id="engineSelector"><button class="engine-tab active" data-engine="baidu">百度</button><button class="engine-tab" data-engine="google"><i class="fab fa-google" aria-hidden="true"></i>Google</button><button class="engine-tab" data-engine="bing">必应</button></div><span class="search-help">输入后按 Enter 联网搜索</span></div>
  </section>
  <section class="collection" aria-label="收藏网站">
   <div class="collection-heading"><div><h2 id="collectionTitle">全部书签</h2><p id="bookmarkCount" aria-live="polite"></p></div><div class="view-switch" aria-label="显示方式"><button id="gridViewBtn" class="active" title="网格视图" aria-label="网格视图" aria-pressed="true"><i class="fas fa-th-large" aria-hidden="true"></i></button><button id="listViewBtn" title="列表视图" aria-label="列表视图" aria-pressed="false"><i class="fas fa-list" aria-hidden="true"></i></button></div></div>
   <main class="bookmarks-grid" id="bookmarksGrid"></main>
   <nav class="pagination" id="pagination" aria-label="书签分页">
    <span class="page-summary" id="pageSummary"></span>
    <div class="pagination-controls">
     <button class="page-button" id="prevPage" type="button" aria-label="上一页" disabled>上一页</button>
     <div class="page-numbers" id="pageNumbers"></div>
     <button class="page-button" id="nextPage" type="button" aria-label="下一页">下一页</button>
    </div>
   </nav>
   <span class="sr-only" id="paginationStatus" role="status" aria-live="polite" aria-atomic="true"></span>
   <div class="empty-state" id="emptyState" style="display:none"><i class="far fa-bookmark" aria-hidden="true"></i><h3>收藏你的第一个网站</h3><p>点击「添加站点」，把常用网站放在这里。</p></div>
  </section>
  <footer class="workspace-footer"><span><i class="fas fa-grip-vertical" aria-hidden="true"></i>拖动调整顺序</span><span>数据保存在此浏览器</span><button id="demoBtn">体验演示数据</button><span class="version">v1.1.0-preview</span></footer>
 </div>
</div>
    <!-- 模态框：添加/编辑 -->
    <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加站点</h2>
                <button class="modal-close" id="modalCancel" title="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-field">
                        <label for="siteTitle">网站标题</label>
                        <input id="siteTitle" type="text" placeholder="例如：Bilibili">
                    </div>
                    <div class="form-field">
                        <label for="siteUrl">网站链接</label>
                        <input id="siteUrl" type="text" placeholder="https://www.bilibili.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="siteCategory">分类</label>
                        <input id="siteCategory" type="text" placeholder="例如：社交 / 开发 / 游戏">
                    </div>
                    <div class="form-field">
                        <label for="siteIcon">图标（可选）</label>
                        <input id="siteIcon" type="text" placeholder="留空则自动抓取">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="siteDesc">描述（可选）</label>
                        <input id="siteDesc" type="text" placeholder="简短描述">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="modalCancelBtn">取消</button>
                <button class="btn btn-primary" id="modalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="importFile" accept="application/json" style="display: none;">

    <script src="app.js"></script>
</body>
</html>
