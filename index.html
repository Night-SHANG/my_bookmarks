<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的导航 · 个人收藏夹</title>
    <meta name="description" content="个人网址导航 — 快速访问常用网站">
    <meta name="theme-color" id="browserThemeColor" content="#73D548">
    <link rel="icon" id="dynamicFavicon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="polish.css">
    <link rel="stylesheet" href="icons.css">
</head>
<body>
<a class="skip-link" href="#searchInput">跳到搜索</a>
<div class="app">
 <aside class="sidebar" aria-label="导航与管理">
  <div class="brand">
    <svg id="brandMark" class="brand-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
     <rect data-brand-fill="true" x="2" y="2" width="124" height="124" rx="30" fill="#73d548"/>
     <path d="M39 19h50c7 0 12 5 12 12v75c0 8-8 13-15 9L64 99 42 115c-7 4-15-1-15-9V31c0-7 5-12 12-12Z" fill="#fff"/>
     <path data-brand-stroke="true" d="M41 65a25 25 0 0 1 40-19" fill="none" stroke="#73d548" stroke-width="6" stroke-linecap="round"/>
     <path data-brand-stroke="true" d="M87 63a25 25 0 0 1-40 19" fill="none" stroke="#73d548" stroke-width="6" stroke-linecap="round"/>
     <path data-brand-fill="true" d="M82 35 68 67 43 93 57 59Z" fill="#73d548"/>
     <path data-brand-fill="true" d="M82 35 68 67 57 59Z" fill="#73d548" opacity=".58"/>
     <circle cx="64" cy="64" r="6" fill="#fff"/>
    </svg>
    <div><h1>我的导航</h1></div>
   </div>
  <nav class="category-bar" id="categoryBar" aria-label="书签分类"></nav>
  <div class="sidebar-footer">
   <button class="sidebar-action" id="categoryOrderBtn" type="button" aria-expanded="false" aria-controls="categoryOrderPanel" aria-haspopup="dialog"><i class="fas fa-list" aria-hidden="true"></i>分类排序</button>
   <button class="sidebar-action" id="dataPanelBtn" type="button" aria-expanded="false" aria-controls="dataPanel" aria-haspopup="dialog"><i class="fas fa-arrow-up-from-bracket" aria-hidden="true"></i>导入 / 导出</button>
   <button class="sidebar-action" id="appearanceBtn" type="button" aria-expanded="false" aria-controls="appearancePanel" aria-haspopup="dialog"><i class="fas fa-gear" aria-hidden="true"></i>外观设置</button>
  </div>
 </aside>
 <div class="workspace">
  <header class="header">
   <div class="header-intro"><h2>我的收藏</h2></div>
   <div class="header-actions">
    <div class="columns-toolbar"><span class="columns-label" id="columnsLabel">列数</span><div class="grid-control" role="group" aria-labelledby="columnsLabel">
     <button class="btn btn-icon" id="colsDecrease" title="减少列数" aria-label="减少列数" type="button"><i class="fas fa-minus" aria-hidden="true"></i></button>
     <span class="cols-display" id="colsDisplay" aria-live="polite">4列</span>
     <button class="btn btn-icon" id="colsIncrease" title="增加列数" aria-label="增加列数" type="button"><i class="fas fa-plus" aria-hidden="true"></i></button>
    </div></div>
    <button class="btn btn-icon header-theme" id="themeToggle" type="button" title="切换为深色模式" aria-label="深色模式" aria-pressed="false"><i class="fas fa-moon" id="themeIcon" aria-hidden="true"></i></button>
    <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus" aria-hidden="true"></i><span>添加站点</span></button>
   </div>
  </header>
  <div id="storageWarning" class="storage-warning" role="alert" hidden></div>
  <section class="search-section" aria-label="查找网站">
   <div class="search-wrapper"><i class="fas fa-search search-icon" aria-hidden="true"></i><input type="search" id="searchInput" class="search-input" placeholder="搜索书签、描述或网址…" aria-label="搜索书签、描述或网址" aria-describedby="searchHelp" title="输入筛选书签；Enter 联网搜索" autocomplete="off"><kbd class="search-kbd">/</kbd></div>
   <div class="engine-row"><span>联网搜索：</span><div class="engine-tabs" id="engineSelector" role="group" aria-label="搜索引擎"><button class="engine-tab active" data-engine="baidu" aria-pressed="true" aria-label="使用 百度 搜索">百度</button><button class="engine-tab" data-engine="google" aria-pressed="false" aria-label="使用 Google 搜索"><i class="fab fa-google" aria-hidden="true"></i>Google</button><button class="engine-tab" data-engine="bing" aria-pressed="false" aria-label="使用 必应 搜索">必应</button></div><span class="sr-only" id="searchHelp">输入内容筛选书签；按 Enter 使用所选引擎联网搜索，或打开输入的网址。</span></div>
  </section>
  <section class="collection" aria-label="收藏网站">
   <div class="collection-heading"><div><h2 id="collectionTitle">全部书签</h2><p id="bookmarkCount" aria-live="polite"></p></div></div>
   <main class="bookmarks-grid" id="bookmarksGrid"></main>
   <nav class="pagination" id="pagination" aria-label="书签分页">
    <span class="page-summary" id="pageSummary"></span>
    <div class="pagination-controls">
     <button class="page-button" id="prevPage" type="button" aria-label="上一页" disabled>上一页</button>
     <div class="page-numbers" id="pageNumbers"></div>
     <button class="page-button" id="nextPage" type="button" aria-label="下一页">下一页</button>
    </div>
   </nav>
   <span class="sr-only" id="paginationStatus" role="status" aria-live="polite" aria-atomic="true"></span>
   <div class="empty-state" id="emptyState" style="display:none"><i class="far fa-bookmark" aria-hidden="true"></i><h3>收藏你的第一个网站</h3><p>点击「添加站点」，把常用网站放在这里。</p></div>
  </section>
  <footer class="workspace-footer"><span class="storage-note">数据仅保存在此浏览器</span></footer>
 </div>
</div>
    <!-- 辅助面板脱离主布局；同一时刻只打开一个。 -->
    <section class="utility-panel" id="dataPanel" role="dialog" aria-modal="false" aria-labelledby="dataPanelTitle" hidden>
        <div class="utility-heading"><h2 id="dataPanelTitle">导入 / 导出</h2><button type="button" class="btn btn-icon" data-close-panel aria-label="关闭导入导出"><i class="fas fa-times" aria-hidden="true"></i></button></div>
        <p class="task-error" id="dataError" role="alert" hidden></p>
        <p id="importStatus" role="status" hidden></p>
        <div class="data-actions"><button class="btn btn-ghost" id="importBtn" type="button">导入 JSON</button><button class="btn btn-ghost" id="exportBtn" type="button">导出 JSON</button></div>
    </section>
    <section class="utility-panel appearance-panel" id="appearancePanel" role="dialog" aria-modal="false" aria-labelledby="appearanceTitle" hidden>
        <div class="utility-heading"><h2 id="appearanceTitle">主题色</h2><button type="button" class="btn btn-icon" data-close-panel aria-label="关闭外观设置"><i class="fas fa-times" aria-hidden="true"></i></button></div>
        <p class="task-error" id="appearanceError" role="alert" hidden></p>
        <div class="color-presets" role="group" aria-label="预设主题色">
            <button type="button" class="color-dot" data-color="#73d548" style="background:#73d548" title="鲜叶绿" aria-label="鲜叶绿" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#54c795" style="background:#54c795" title="薄荷绿" aria-label="薄荷绿" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#49beb0" style="background:#49beb0" title="湖水青" aria-label="湖水青" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#5db9df" style="background:#5db9df" title="晴空蓝" aria-label="晴空蓝" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#799be0" style="background:#799be0" title="矢车菊蓝" aria-label="矢车菊蓝" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#a28cdb" style="background:#a28cdb" title="鸢尾紫" aria-label="鸢尾紫" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#db91ae" style="background:#db91ae" title="樱花粉" aria-label="樱花粉" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#e8ae70" style="background:#e8ae70" title="蜜杏橙" aria-label="蜜杏橙" aria-pressed="false"></button>
            <button type="button" class="color-dot" data-color="#d9c35e" style="background:#d9c35e" title="柠檬黄" aria-label="柠檬黄" aria-pressed="false"></button>
        </div>
        <div class="color-custom"><label for="customColor">自定义</label><input type="color" id="customColor" value="#73d548"><button type="button" class="btn btn-ghost" id="resetAccent">恢复默认</button></div>
    </section>

    <section class="utility-panel" id="categoryOrderPanel" role="dialog" aria-modal="false" aria-labelledby="categoryOrderTitle" hidden>
        <div class="utility-heading"><h2 id="categoryOrderTitle">分类排序</h2><button type="button" class="btn btn-icon" data-close-panel aria-label="关闭分类排序"><i class="fas fa-times" aria-hidden="true"></i></button></div>
        <p class="task-error" id="categoryOrderError" role="alert" hidden></p>
        <label for="categoryOrderSelect">选择分类</label>
        <select id="categoryOrderSelect"></select>
        <div class="data-actions"><button type="button" class="btn btn-ghost" id="categoryUpBtn">上移</button><button type="button" class="btn btn-ghost" id="categoryDownBtn">下移</button></div>
        <p id="categoryOrderStatus" class="sr-only" role="status"></p>
    </section>
    <aside id="operationError" class="task-alert" role="alert" hidden><span data-error-text></span><button type="button" class="btn btn-icon" id="dismissOperationError" aria-label="关闭错误提示"><i class="fas fa-times" aria-hidden="true"></i></button></aside>

    <!-- 模态框：添加/编辑 -->
    <div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <form class="modal-content" id="siteForm" novalidate>
            <div class="modal-header">
                <h2 id="modalTitle">添加站点</h2>
                <button type="button" class="modal-close" id="modalCancel" title="关闭" aria-label="关闭弹窗">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p class="task-error" id="formError" role="alert" hidden></p>
                <div class="form-row">
                    <div class="form-field">
                        <label for="siteTitle">网站标题（必填）</label>
                        <input id="siteTitle" type="text" aria-describedby="siteTitleError" required placeholder="例如：Bilibili">
                        <p class="field-error" id="siteTitleError" hidden></p>
                    </div>
                    <div class="form-field">
                        <label for="siteUrl">网站链接（必填）</label>
                        <input id="siteUrl" type="text" aria-describedby="siteUrlError" required inputmode="url" placeholder="https://www.bilibili.com">
                        <p class="field-error" id="siteUrlError" hidden></p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="siteCategory">分类</label>
                        <input id="siteCategory" type="text" placeholder="例如：社交 / 开发 / 游戏">
                    </div>
                    <div class="form-field">
                        <label for="siteIcon">图标（可选）</label>
                        <input id="siteIcon" type="text" aria-describedby="siteIconError" inputmode="url" placeholder="留空则自动抓取">
                        <p class="field-error" id="siteIconError" hidden></p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="siteDesc">描述（可选）</label>
                        <input id="siteDesc" type="text" placeholder="简短描述">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" id="modalCancelBtn">取消</button>
                <button type="submit" class="btn btn-primary" id="modalSave">保存</button>
            </div>
        </form>
    </div>

    <!-- Toast 通知容器 -->
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="importFile" accept="application/json" style="display: none;">

    <script src="app.js"></script>
</body>
</html>
