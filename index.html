<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网址导航</title>
    <meta name="description" content="个人网址导航 — 快速访问常用网站">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 头部 -->
        <header class="header">
            <div class="header-brand">
                <h1 class="brand-title">
                    <span class="brand-icon"><i class="fas fa-compass"></i></span>
                    网址导航
                </h1>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="addBtn">
                    <i class="fas fa-plus"></i>
                    <span>添加</span>
                </button>
                <button class="btn btn-ghost" id="exportBtn">
                    <i class="fas fa-download"></i>
                    <span>导出</span>
                </button>
                <button class="btn btn-ghost" id="importBtn">
                    <i class="fas fa-upload"></i>
                    <span>导入</span>
                </button>
                <div class="grid-control">
                    <button class="btn btn-icon" id="colsDecrease" title="减少列数">
                        <i class="fas fa-minus"></i>
                    </button>
                    <span class="cols-display" id="colsDisplay">4列</span>
                    <button class="btn btn-icon" id="colsIncrease" title="增加列数">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="color-picker-wrapper">
                    <button class="btn btn-icon" id="colorPickerBtn" title="自定义主题色">
                        <i class="fas fa-palette"></i>
                    </button>
                    <div class="color-picker-panel" id="colorPanel">
                        <div class="color-presets">
                            <button class="color-dot" data-color="#c9553d" style="background:#c9553d" title="赤陶橙"></button>
                            <button class="color-dot" data-color="#4f46e5" style="background:#4f46e5" title="靛蓝"></button>
                            <button class="color-dot" data-color="#059669" style="background:#059669" title="翡翠绿"></button>
                            <button class="color-dot" data-color="#d97706" style="background:#d97706" title="琥珀黄"></button>
                            <button class="color-dot" data-color="#e11d48" style="background:#e11d48" title="玫瑰红"></button>
                            <button class="color-dot" data-color="#7c3aed" style="background:#7c3aed" title="紫罗兰"></button>
                            <button class="color-dot" data-color="#0284c7" style="background:#0284c7" title="天蓝"></button>
                            <button class="color-dot" data-color="#475569" style="background:#475569" title="石板灰"></button>
                        </div>
                        <div class="color-custom">
                            <input type="color" id="customColor" value="#c9553d" title="选择自定义颜色">
                            <span>自定义颜色</span>
                        </div>
                    </div>
                </div>
                <button class="btn btn-icon" id="themeToggle" title="切换深色模式">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </header>

        <!-- 搜索区域 -->
        <section class="search-section">
            <div class="engine-tabs" id="engineSelector">
                <button class="engine-tab active" data-engine="baidu">百度</button>
                <button class="engine-tab" data-engine="google">Google</button>
                <button class="engine-tab" data-engine="bing">必应</button>
            </div>
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input"
                       placeholder="搜索书签或输入网址…"
                       autocomplete="off">
                <kbd class="search-kbd">/</kbd>
            </div>
        </section>

        <!-- 分类导航 -->
        <nav class="category-bar" id="categoryBar">
            <!-- 动态生成 -->
        </nav>

        <!-- 书签网格 -->
        <main class="bookmarks-grid" id="bookmarksGrid">
            <!-- 动态生成 -->
        </main>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-bookmark"></i>
            <h3>还没有书签</h3>
            <p>点击上方「添加」按钮开始收藏你的网站</p>
        </div>
    </div>

    <!-- 模态框：添加/编辑 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">添加站点</h2>
                <button class="modal-close" id="modalCancel" title="关闭">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-field">
                        <label for="siteTitle">网站标题</label>
                        <input id="siteTitle" type="text" placeholder="例如：Bilibili">
                    </div>
                    <div class="form-field">
                        <label for="siteUrl">网站链接</label>
                        <input id="siteUrl" type="text" placeholder="https://www.bilibili.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label for="siteCategory">分类</label>
                        <input id="siteCategory" type="text" placeholder="例如：社交 / 开发 / 游戏">
                    </div>
                    <div class="form-field">
                        <label for="siteIcon">图标（可选）</label>
                        <input id="siteIcon" type="text" placeholder="留空则自动抓取">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-field full-width">
                        <label for="siteDesc">描述（可选）</label>
                        <input id="siteDesc" type="text" placeholder="简短描述">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="modalCancelBtn">取消</button>
                <button class="btn btn-primary" id="modalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="importFile" accept="application/json" style="display: none;">

    <script src="app.js"></script>
</body>
</html>
